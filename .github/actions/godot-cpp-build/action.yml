name: Build godot-cpp
description: Build godot-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The godot-cpp branch.
    default: master
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        repository: godotengine/godot-cpp
        ref: ${{ inputs.godot-cpp-branch }}
        path: godot-cpp

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    - name: Patch ar to use response files
      shell: sh
      run: |
        mkdir -p /tmp/ar-wrap
        cat > /tmp/ar-wrap/ar << 'EOF'
#!/bin/sh
# If arg list is long enough to risk ARG_MAX, write objects to a response file
# and pass @file to the real ar, which GNU ar supports.
if [ "$#" -gt 200 ]; then
    flags="$1"; tgt="$2"; shift 2
    rsp=$(mktemp /tmp/ar-rsp.XXXXXX)
    printf '%s\n' "$@" > "$rsp"
    /usr/bin/ar "$flags" "$tgt" "@$rsp"
    status=$?
    rm -f "$rsp"
    exit $status
fi
exec /usr/bin/ar "$@"
EOF
        chmod +x /tmp/ar-wrap/ar
        echo "/tmp/ar-wrap" >> "$GITHUB_PATH"

    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      run: scons --directory=./godot-cpp/test "gdextension_dir=${{ github.workspace }}" ${{ inputs.scons-flags }}
